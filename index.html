<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="Learn GRE vocabulary with Bengali meanings, stories and quizzes.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Lexi – Story Vocabulary</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1f2430;--mut:#6b7280;--acc:#4f46e5;--acc2:#eef0ff;--ok:#15803d;--okb:#e6f6ec;--bad:#b91c1c;--badb:#fdecec;--line:#e8e2d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161d;--card:#1d2029;--ink:#eceef4;--mut:#9aa1b2;--acc:#8b93ff;--acc2:#262a3d;--ok:#4ade80;--okb:#16301f;--bad:#f87171;--badb:#3a1c1c;--line:#2c3040}}
:root[data-theme="dark"]{--bg:#14161d;--card:#1d2029;--ink:#eceef4;--mut:#9aa1b2;--acc:#8b93ff;--acc2:#262a3d;--ok:#4ade80;--okb:#16301f;--bad:#f87171;--badb:#3a1c1c;--line:#2c3040}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.6 'Hind Siliguri','Noto Sans Bengali','Kalpurush',system-ui,sans-serif;min-height:100%}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{font:700 22px 'Fraunces',Georgia,serif;color:var(--acc)}
.tabs{display:flex;gap:6px;background:var(--acc2);padding:4px;border-radius:14px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:600 14px inherit;font-family:inherit;padding:10px 6px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--acc);box-shadow:0 1px 4px #0002}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;text-align:center;box-shadow:0 8px 30px #0000000d;margin-bottom:14px}
.fc{animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.pic svg{display:block;margin:0 auto;width:88%;max-width:300px;height:auto;border-radius:14px}.pic{font-size:84px;line-height:1.1;background:linear-gradient(135deg,var(--acc2),var(--bg));border-radius:20px;padding:22px 0;margin-bottom:14px}
.word{font:700 40px 'Fraunces',Georgia,serif;margin:4px 0}
.ipa{color:var(--mut);font-size:19px;display:flex;justify-content:center;align-items:center;gap:10px}
.spk{border:0;background:var(--acc);color:#fff;width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer}
.big{font-size:26px;font-weight:700;margin:12px 0 0}.mut{color:var(--mut);font-size:15px}
.ex{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px;text-align:left}.ex p{margin:4px 0}
.bar{height:6px;background:var(--acc2);border-radius:9px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.nav{display:flex;gap:10px}
.btn{flex:1;border:0;background:var(--acc);color:#fff;font:600 16px inherit;font-family:inherit;padding:14px;border-radius:14px;cursor:pointer}
.btn.sec{background:var(--acc2);color:var(--acc)}.btn:disabled{opacity:.4;cursor:default}
.story{text-align:left;font-size:19px;line-height:1.95}.story h2{font-size:26px;margin:0 0 10px;text-align:center}.story b{color:var(--acc);background:var(--acc2);padding:0 5px;border-radius:6px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;margin:8px 0;font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.bad{border-color:var(--bad);background:var(--badb)}
.q{text-align:left;font-size:20px}.hint{color:var(--mut);font-size:16px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:99px;font:inherit;cursor:pointer}.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.score{font:700 56px 'Fraunces',Georgia,serif;color:var(--acc)}
.rev{text-align:left;border-top:1px solid var(--line);padding:10px 0;font-size:16px}
.left{text-align:left}h3{margin:14px 0 4px;font-size:16px;color:var(--mut)}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.stats{display:flex;gap:8px;margin-bottom:12px}.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}.stats b{display:block;font-size:24px;color:var(--acc)}
#pop{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(92%,600px);background:var(--card);border:1px solid var(--acc);border-radius:20px;padding:16px 18px;box-shadow:0 10px 40px #0004;display:none;z-index:5}#pop .x{float:right;border:0;background:var(--acc2);color:var(--acc);width:32px;height:32px;border-radius:50%;cursor:pointer}.story b{cursor:pointer;border-bottom:2px dotted var(--acc)}.bcard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:0 0 10px;font:inherit;cursor:pointer}.bcard.lock{opacity:.55;cursor:default}.bi{font-size:28px}#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;display:none}
</style></head><body>

B.push({t:'নীলার নতুন স্কুল',w:W2,s:`<p>নীলা নতুন শহরের এক স্কুলে ভর্তি হলো, কিন্তু নতুন পরিবেশ নিয়ে তার মনে ছিল <b>ambivalence</b>—একদিকে উত্তেজনা, অন্যদিকে ভয়। প্রথম দিনে ক্লাসের নিয়মগুলো ছিল <b>ambiguous</b>; কে কোথায় বসবে তা কেউ স্পষ্ট করে বলেনি। ফলে ঘরজুড়ে এক ধরনের <b>anarchy</b> শুরু হয়ে গেল। শিক্ষিকা এসে বললেন, “স্কুলের পুরোনো নিয়মগুলো এখনকার যুগে একটি <b>anachronism</b>, তাই আমরা সেগুলো নতুনভাবে সাজাব।”</p><p>নীলা লক্ষ করল, সহপাঠী রিমনের আচরণ <b>anomalous</b>—সে সবার সঙ্গে হাসলেও কারও সঙ্গে বসত না। পরে বোঝা গেল, আগের স্কুলের জন্য মন খারাপ থাকায় নতুন সবকিছুর প্রতি তার মনে একধরনের <b>antipathy</b> জন্মেছে। নীলা বুঝল, তার নিজের অবস্থাও রিমনের <b>analogous</b>—দুজনেই নতুন জায়গায় একা।</p><p>নিজের আর রিমনের একাকিত্ব <b>alleviate</b> করতে নীলা তাকে ক্যান্টিনে ডাকল। ধীরে ধীরে তাদের ছোট ছোট বন্ধুদল <b>amalgamate</b> হয়ে একটি বড় দল হলো, আর ক্লাসের পরিবেশ দিন দিন <b>ameliorate</b> হতে লাগল।</p>`});

B.push({t:'সাজ্জাদের পুরোনো জিনিসের দোকান',w:W5,s:`<p>শহরের নদীর ধারে নতুন ব্যবসা দ্রুত <b>burgeon</b> করছিল। সেখানে সাজ্জাদ একটি পুরোনো জিনিসের দোকান খুলল। সে নিজ হাতে পুরোনো বাতি <b>burnish</b> করে চকচকে করে তুলত। এক ক্রেতা, হক সাহেব, ছিলেন <b>boorish</b>—দোকানে ঢুকেই রুক্ষভাবে দাম নিয়ে কথা বলতেন। সাজ্জাদ ধৈর্য ধরে নানা প্রমাণ দিয়ে নিজের দামের যুক্তিকে <b>buttress</b> করল।</p><p>একদিন হক সাহেব <b>chicanery</b> করে বাতির দাম কমাতে চাইলেন। পাশের দোকানদাররা সবার সামনে তাঁর <b>castigation</b> শুরু করলেন, আর তাঁর <b>caustic</b> ভাষাও থেমে গেল। আসলে তাঁর মেজাজ ছিল <b>capricious</b>—এই ভালো, এই খারাপ।</p><p>ঘটনাটি সাজ্জাদের দোকানের জন্য <b>catalyst</b> হলো; সবাই তার সততার কথা জানল। সন্ধ্যায় বাড়ি ফিরে সে দেখল, মা দুধে লেবু দিতেই তা <b>coagulate</b> হয়ে ছানা হয়ে যাচ্ছে—ঠিক যেমন ভালো মানুষের সুনাম ধীরে ধীরে জমাট বাঁধে।</p>`});

B.push({t:'গ্রামের মোড়ের সভা',w:W7,s:`<p>গ্রামে নতুন রাস্তা নিয়ে সভা বসল। দুটি পুরোনো সড়ক যেখানে <b>converge</b> করে, সেখানে বাজার বসানো হবে কি না—এটি ছিল এক <b>conundrum</b>। প্রধান জাফর সাহেবের <b>contention</b> ছিল, বাজার বসলে গ্রাম বাড়বে। কিন্তু প্রতিবেশী কবির ছিলেন <b>contentious</b>—প্রতিটি কথায় তর্ক জুড়ে দিতেন।</p><p>কবিরের কথাগুলো ছিল <b>convoluted</b>—কেউই ধরতে পারছিল না তিনি কী বলতে চান। জাফর সাহেব বললেন, “সভার <b>decorum</b> বজায় রাখুন।” এক সদস্য ভয়ে চুপ করে রইলেন; কবির তাঁকে <b>craven</b> বলে বিদ্রূপ করলেন।</p><p>তরুণী রিতা কবিরের ধমকে <b>daunt</b> হলো না। সে বলল, “সভায় এসে মত না দেওয়াও এক ধরনের <b>default</b>—দায়িত্ব পালনে ব্যর্থতা।” কথাটা শুনে কবির লজ্জিত হলেন এবং <b>contrite</b> হয়ে সবার কাছে ক্ষমা চাইলেন।</p>`});

B.push({t:'স্কুলের বিতর্ক প্রতিযোগিতা',w:W8,s:`<p>স্কুলে বিতর্ক প্রতিযোগিতা হচ্ছিল। অতিথি বিচারকদের প্রতি সবাই <b>deference</b> দেখাল। বিষয় ছিল “পড়াশোনা বনাম খেলাধুলা”—এই <b>dichotomy</b> নিয়ে ছাত্রদের মতবিরোধ ছিল। প্রথম বক্তা তার যুক্তির মূল ধারাগুলো <b>delineate</b> করল।</p><p>দ্বিতীয় বক্তা মাহিন ছিল কিছুটা <b>derivative</b>—নিজের নয়, ইন্টারনেট থেকে নেওয়া কথা। তার কথাবার্তা <b>desultory</b>—একটা বিষয় ছেড়ে আরেকটায় চলে যাচ্ছিল। এক দর্শক তাকে <b>deride</b> করল, আরেকজন বিরোধী দলকে <b>denigrate</b> করে তিক্ত <b>diatribe</b> শুরু করল।</p><p>শিক্ষক সতর্ক করলেন—এ ধরনের আচরণ ভবিষ্যতে অংশ নেওয়ার সুযোগ কমিয়ে দেবে; এই কথাই সবার জন্য এক <b>deterrent</b> হয়ে দাঁড়াল। গরমে হলঘরের বাতাস এত শুকনো ছিল যে বক্তাদের গলা <b>desiccate</b> হয়ে যাচ্ছিল, তাই সবাই বিরতির পর আরও শান্তভাবে ফিরে এল।</p>`});

B.push({t:'গবেষণাগারের সাবিনা',w:W12,s:`<p>ডা. সাবিনা একটি নতুন ওষুধের <b>efficacy</b> পরীক্ষা করছিলেন। তাঁর ছাত্র তুহিন তাঁকে <b>emulate</b> করতে চাইত। সাবিনা শুধু <b>empirical</b> তথ্য বিশ্বাস করতেন—কল্পনা নয়। রোগীদের কাছ থেকে সঠিক তথ্য <b>elicit</b> করতে তিনি ধৈর্য ধরে প্রশ্ন করতেন।</p><p>একদিন বহিরাগত এক ব্যক্তি এসে গবেষণার ফল <b>embellish</b> করে সংবাদমাধ্যমে বলল, আর <b>effrontery</b> দেখিয়ে সাবিনার কাছেই কৃতিত্ব দাবি করল। সাবিনা শান্ত থাকলেন। গ্রামে ম্যালেরিয়া ছিল <b>endemic</b>, আর কাজের চাপ ও গরম সবাইকে <b>enervate</b> করে দিচ্ছিল।</p><p>তবু সাবিনার সততা সবার মধ্যে আস্থা <b>engender</b> করল। অনেক বছর পর সাবিনা প্রয়াত হলে তুহিন তাঁর স্মৃতিতে একটি <b>elegy</b> লিখল।</p>`});

B.push({t:'নতুন ক্লাসের তামিম',w:W16,s:`<p>নতুন স্কুলে এসে তামিম ছিল <b>gregarious</b>; সহজে বন্ধু বানাত। তার মুখ ছিল <b>guileless</b>, তাই সবাই বিশ্বাস করত। কিন্তু সে ছিল কিছুটা <b>gullible</b>—যে যা বলত, তাই মেনে নিত।</p><p>ক্লাসের এক ছেলে রনি <b>hyperbole</b> করে বলত, সে নাকি একদিনে একশো কিলোমিটার দৌড়েছে। অন্য একজন <b>grandiloquent</b> ভাষায় বড় বড় কথা বলত। স্কুলে ছাত্রদের পোশাক ও চিন্তা <b>homogeneous</b> ছিল; তাই একজন <b>iconoclastic</b> ছাত্রী নীলা প্রচলিত ধারণা ভাঙতে চাইত। কেউ কেউ বিখ্যাত ক্রিকেটারের প্রতি <b>idolatry</b> দেখাত।</p><p>কোচ একদিন <b>harangue</b> করে বললেন, নিয়ম <b>immutable</b>। এরপর তামিম বুঝল, সবাইকে বিশ্বাস করা ঠিক না এবং সত্য যাচাই করতে শিখল।</p>`});

B.push({t:'পুরোনো ভবন ভাঙার দিন',w:W17,s:`<p>প্রকৌশলী মীরা ছিলেন <b>imperturbable</b>—সংকটেও বিচলিত হতেন না। পুরোনো ভবন ভাঙার দিন ভারী বৃষ্টি কাজে <b>impede</b> করছিল। ভবনের ছাদ ছিল <b>impermeable</b> আস্তরণে ঢাকা, তাই পানি ভেতরে ঢুকছিল না।</p><p>এক শ্রমিক <b>inadvertently</b> ভুল তার কেটে ফেলল, ফলে নিয়ন্ত্রণ ব্যবস্থা <b>impair</b> হলো। মীরা <b>impassive</b> থেকে ধীরে ধীরে সমস্যা সমাধান করলেন। ম্যানেজার ছিলেন <b>implacable</b>—ভুল সহ্য করতেন না, কিন্তু মীরা তাঁর রাগে <b>impervious</b> থেকে নিজের কাজ চালিয়ে গেলেন।</p><p>মীরা ও ম্যানেজারের মধ্যে একটি <b>implicit</b> বোঝাপড়া ছিল: নিরাপত্তা সবার আগে। শেষে ভবনটি নিরাপদে <b>implode</b> হয়ে ভেতরের দিকে ধসে পড়ল, কেউ আহত হলো না।</p>`});

B.push({t:'নদীর ধারের গ্রাম',w:W19,s:`<p>নদীর ধারের এক গ্রাম ছিল <b>insularity</b>-তে ভরা—বাইরের দুনিয়ার খবর কেউ রাখত না। ভাবা হতো নদীটি <b>innocuous</b>—কোনো ক্ষতি করবে না। গ্রামবাসী ঠান্ডা, কাদা আর কষ্টে <b>inured</b> ছিল।</p><p>এক তরুণ ইঞ্জিনিয়ার এসে বন্যার ঝুঁকির কথা বলল। বৃদ্ধ মোড়ল ছিলেন <b>intractable</b>—<b>intransigence</b> দেখিয়ে কোনো পরামর্শ নিতে চাইলেন না। তিনি আড়ালে <b>insinuate</b> করলেন, ইঞ্জিনিয়ার টাকা চায়, আর তাঁর দিকে <b>invective</b> ছুড়ে দিলেন। জনসভায় মোড়লের বক্তৃতা ছিল <b>insipid</b>—স্বাদহীন, ফাঁকা কথা।</p><p>এক রাতে প্রবল বৃষ্টিতে নদী ফুলে উঠল। গ্রাম পানিতে <b>inundate</b> হলো; অনেকে তখন গভীর ঘুমে <b>insensible</b> ছিল। ইঞ্জিনিয়ার সবাইকে জাগিয়ে উদ্ধার করল।</p>`});

B.push({t:'ফাইনালের দিন',w:W23,s:`<p>শহরের <b>paragon</b> খেলোয়াড় হিসেবে পরিচিত ছিল ইমরান; তার আচরণ ও খেলায় সবাই মুগ্ধ। ফাইনালের দিন দর্শকরা ছিল <b>partisan</b>—শুধু নিজেদের দলকেই সমর্থন করছিল। এক ধনী সমর্থক <b>ostentatious</b> পোশাকে এসে নজর কাড়ার চেষ্টা করল।</p><p>মাঠের এক কর্মকর্তা ছিল <b>officious</b>; সবাইকে জেরা করছিল। ইমরানের ডাক্তার জানালেন তার হাঁটুতে <b>pathological</b> পরিবর্তন আছে, তবু সে খেলা চালিয়ে যেতে চাইল। প্রশিক্ষণ ছিল <b>onerous</b>—রোজ কঠিন অনুশীলন। ম্যাচের ভাগ্য দুই দলের মধ্যে <b>oscillate</b> করছিল।</p><p>রেফারি একটি ভুল সিদ্ধান্ত দিলে সবাই তাকে <b>opprobrium</b>-এর মুখে ফেলল; মাঠের সংকীর্ণ প্রবেশপথ <b>occlude</b> হয়ে ভিড় জমে গেল। ইমরান শান্ত থেকে সবাইকে শান্ত করল, আর তার সংযম ঝগড়া <b>obviate</b> করল।</p>`});

{w:'Whimsical',i:'/ˈwɪmzɪkl/',b:'খেয়ালি; কল্পনাপ্রবণ',d:'capricious; fanciful',e:'She had a whimsical idea to paint the door purple.',t:'দরজাটি বেগুনি রঙে রাঙানোর একটি খেয়ালি ভাবনা তার মাথায় এল।'},
{w:'Zealot',i:'/ˈzelət/',b:'গোঁড়া উগ্রপন্থী; অতি উৎসাহী',d:'fanatic; person who shows excessive zeal',e:'The zealot refused to listen to any other view.',t:'অতি উৎসাহী গোঁড়া লোকটি অন্য কোনো মত শুনতে রাজি হলো না।'}];
B.push({t:'মায়ার রঙিন ঘর',w:W34,s:`<p>শিল্পী মায়ার ঘরটি ছিল কাগজ আর রঙের এক <b>welter</b>—এলোমেলো জট। তার <b>whimsical</b> স্বভাবের কারণে সে হঠাৎ করে দেয়ালে বেগুনি রঙ লাগাতে চাইত।</p><p>এক <b>zealot</b> প্রতিবেশী বললেন, ঘর সাদা না হলে চলবে না—তিনি কোনো অন্য মত শুনতে চাইতেন না। মায়া হেসে নিজের মতো রং করল, আর শেষে সবাই বলল ঘরটি খুব সুন্দর হয়েছে।</p>`});
Object.assign(ART,{
Welter:'<svg viewBox="0 0 200 120"><rect width="200" height="120" rx="14" fill="#fff7ed"/><rect x="26" y="28" width="46" height="34" fill="#fff" stroke="#64748b" stroke-width="3" transform="rotate(-18 49 45)"/><rect x="84" y="54" width="44" height="44" fill="#d6a35a" stroke="#78350f" stroke-width="3" transform="rotate(22 106 76)"/><rect x="128" y="20" width="40" height="30" fill="#bfdbfe" stroke="#2563eb" stroke-width="3" transform="rotate(-8 148 35)"/><circle cx="56" cy="88" r="14" fill="#fca5a5" stroke="#dc2626" stroke-width="3"/><path d="M20 100q40-70 80-20t80-30M30 20q60 20 100 60" stroke="#a855f7" stroke-width="4" fill="none" stroke-linecap="round"/><polygon points="160,76 170,96 148,96" fill="#fde047" stroke="#ca8a04" stroke-width="3"/></svg>',
Whimsical:'<svg viewBox="0 0 200 120"><rect width="200" height="120" rx="14" fill="#fdf4ff"/><circle cx="90" cy="46" r="30" fill="#f9a8d4" stroke="#be185d" stroke-width="3"/><path d="M90 46m-4 0a4 4 0 1 1 8 0 10 10 0 1 1-18 0 16 16 0 1 1 30 0 22 22 0 1 1-44 0" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M90 76q4 24 24 36" stroke="#a16207" stroke-width="6" fill="none" stroke-linecap="round"/><g fill="#fbbf24"><polygon points="150,20 153,28 162,28 155,33 158,41 150,36 142,41 145,33 138,28 147,28"/><polygon points="40,84 42,90 48,90 43,94 45,100 40,96 35,100 37,94 32,90 38,90"/></g><circle cx="156" cy="76" r="9" fill="#a78bfa"/><circle cx="134" cy="98" r="6" fill="#34d399"/></svg>',
Zealot:'<svg viewBox="0 0 200 120"><rect width="200" height="120" rx="14" fill="#fef2f2"/><circle cx="80" cy="68" r="30" fill="#fcd9b6" stroke="#7f1d1d" stroke-width="3"/><path d="M56 42q4-22 24-18 8-14 18 2 12 0 6 16Z" fill="#f97316"/><path d="M64 62l14 4M96 62l-14 4" stroke="#450a0a" stroke-width="4" stroke-linecap="round"/><circle cx="70" cy="68" r="3.5" fill="#1f2937"/><circle cx="90" cy="68" r="3.5" fill="#1f2937"/><path d="M66 86q14 10 28 0Z" fill="#7f1d1d"/><path d="M130 112V28" stroke="#78716c" stroke-width="5" stroke-linecap="round"/><path d="M130 28q30-10 40 6t-40 14Z" fill="#dc2626"/></svg>'});
const BACK='<button class="chip" onclick="goHome()" style="margin-bottom:10px">← Batches</button>';
const dflt=()=>({b:0,c:0,stage:'home',tab:'learn',done:[],stories:[],m:{},res:[],bp:{},fin:[]});
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s&&typeof s==='object')return Object.assign(dflt(),s)}catch(e){}return dflt()}
let st=load(),T=null,R=null,tick=null,cfg={n:10,min:0};
const app=document.getElementById('app');
function save(){if(st.stage!=='home'&&B[st.b])st.bp[st.b]={c:st.c,stage:st.stage};try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}}
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const learned=()=>st.done.flatMap(i=>B[i]?B[i].w:[]);
const isMast=w=>{const m=st.m[w];return !!m&&m.s>=2&&m.c>=2};
const weak=()=>learned().filter(x=>{const m=st.m[x.w];return m&&m.w>0&&!isMast(x.w)});
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function say(w){if(!('speechSynthesis' in window)){toast('Audio is not supported in this browser');return}
 const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.85;const v=speechSynthesis.getVoices().find(v=>v.lang==='en-US');if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}
function tab(t){if(tick)clearInterval(tick);T=null;R=null;st.tab=t;save();render()}
function render(){closePop();
 document.getElementById('t-learn').className=st.tab==='learn'?'on':'';document.getElementById('t-all').className=st.tab==='all'?'on':'';
 document.getElementById('tot').textContent=learned().length+' / '+TOTAL+' words learned';
 if(T)return renderTest();if(R)return renderResult();
 st.tab==='all'?allView():learnView();window.scrollTo(0,0)}
function homeView(){
 const left=TOTAL-B.reduce((a,b)=>a+b.w.length,0);
 const cards=B.map((b,i)=>{const fin=st.fin.includes(i),open=i===0||st.fin.includes(i-1),p=st.bp[i];
  const sub=fin?'Completed ✓ · tap to review':(p&&(p.c>0||p.stage!=='learn')?'In progress':(open?'Ready to start':'Locked — finish the previous batch'));
  return `<button class="bcard ${open?'':'lock'}" ${open?`onclick="openBatch(${i})"`:'disabled'}><span class="bi">${fin?'✅':open?'📖':'🔒'}</span><span><b>Batch ${i+1}</b><br><span class="mut">${b.t} · ${sub}</span></span></button>`}).join('');
 app.innerHTML=`<h2 style="margin:4px 0">Your batches</h2><p class="mut" style="margin:0 0 12px">Finish a batch’s flashcards, story and test, then come back here to open the next one.</p>${cards}<div class="bcard lock"><span class="bi">⏳</span><span><b>${left>0?'More batches coming':'Every batch is added'}</b><br><span class="mut">${left>0?left+' words still to be added':'All 333 words are in. Use the All Vocabulary Test to revise.'}</span></span></div>`}
function openBatch(i){const p=st.bp[i];st.b=i;if(st.fin.includes(i)||!p){st.c=0;st.stage='learn'}else{st.c=p.c;st.stage=p.stage}save();render()}
function learnView(){
 if(st.stage==='home')return homeView();
 const bt=B[st.b];
 if(!bt){app.innerHTML=`<div class="card"><div class="pic">📚</div><h2>Batch ${st.b+1} is next</h2><p class="mut">Batch ${st.b+1} hasn’t been added yet. Your progress is saved — you can review what you’ve learned in the All Vocabulary Test.</p><div class="nav"><button class="btn" onclick="tab('all')">All Vocabulary Test</button></div></div>`;return}
 if(st.stage==='learn'){const x=bt.w[st.c],last=st.c===bt.w.length-1;
  app.innerHTML=`${BACK}<div class="mut">Batch ${st.b+1} · Flashcards</div><div class="bar"><i style="width:${(st.c+1)/bt.w.length*100}%"></i></div>
  <div class="card fc"><div class="pic" role="img" aria-label="${x.w}">${ART[x.w]||x.m}</div><h1 class="word">${x.w}</h1>
  <div class="ipa">${x.i}<button class="spk" onclick="say('${x.w}')" aria-label="Play American pronunciation">🔊</button></div>
  <div class="big">${x.b}</div><div class="mut">${x.d}</div>
  <div class="ex"><p>${x.e}</p><p class="mut">${x.t}</p></div></div>
  <div class="nav"><button class="btn sec" onclick="prevCard()" ${st.c?'':'disabled'}>Previous</button><button class="btn" onclick="nextCard()">${last?'Finish &amp; read the story':'Next'}</button></div>`}
 else if(st.stage==='story'){
  app.innerHTML=`${BACK}<div class="card story"><div class="mut" style="text-align:center">Batch ${st.b+1} · Story</div><h2>${bt.t}</h2><p class="mut" style="text-align:center;margin-top:0">Tap a highlighted word to see its Bengali meaning</p>${bt.s}</div><div class="nav"><button class="btn" onclick="toTest()">Start batch test</button></div>`;app.querySelectorAll('.story b').forEach(e=>e.onclick=()=>showMean(e.textContent))}
 else{app.innerHTML=`${BACK}<div class="card left"><h2 style="margin-top:0">Batch ${st.b+1} test</h2><p class="mut">Questions come only from this batch’s words.</p>${cfgHTML([5,10,15,20])}<div class="nav"><button class="btn" onclick="startBatch()">Start test</button></div></div>`}}
function prevCard(){if(st.c>0){st.c--;save();render()}}
function nextCard(){const bt=B[st.b];if(st.c<bt.w.length-1){st.c++}else{if(!st.done.includes(st.b))st.done.push(st.b);st.stage='story'}save();render()}
function toTest(){if(!st.stories.includes(st.b))st.stories.push(st.b);st.stage='test';save();render()}
function cfgHTML(counts){return `<h3>Number of questions</h3><div class="chips">${counts.map(n=>`<button class="chip ${cfg.n===n?'on':''}" onclick="setCfg('n',${n})">${n}</button>`).join('')}</div><h3>Timer</h3><div class="chips">${[0,3,5,10].map(m=>`<button class="chip ${cfg.min===m?'on':''}" onclick="setCfg('min',${m})">${m?m+' min':'Off'}</button>`).join('')}</div>`}
function setCfg(k,v){cfg[k]=v;render()}
function allView(){
 const L=learned(),wk=weak(),ms=L.filter(x=>isMast(x.w)).length;
 if(L.length<4){app.innerHTML=`<div class="card"><div class="pic">🔒</div><h2>Nothing to test yet</h2><p class="mut">Finish the flashcards of a batch and this test will include its words automatically.</p><div class="nav"><button class="btn" onclick="tab('learn')">Go to Learn</button></div></div>`;return}
 const hist=st.res.slice(-5).reverse().map(r=>`<div class="row"><span>${r.k}</span><span>${r.s}/${r.t} · ${new Date(r.d).toLocaleDateString()}</span></div>`).join('');
 app.innerHTML=`<div class="stats"><div><b>${L.length}</b><span class="mut">Learned</span></div><div><b>${ms}</b><span class="mut">Mastered</span></div><div><b>${wk.length}</b><span class="mut">Weak</span></div></div>
 <div class="card left"><h2 style="margin-top:0">All Vocabulary Test</h2><p class="mut">Random questions from every word you have learned so far.</p>${cfgHTML([5,10,20,30])}
 <div class="nav"><button class="btn" onclick="startAll('all')">Start test</button><button class="btn sec" onclick="startAll('weak')" ${wk.length>=1?'':'disabled'}>Practise weak words</button></div></div>
 ${hist?`<div class="card left"><h3 style="margin-top:0">Recent results</h3>${hist}</div>`:''}`}
function makeQs(pool,n,dp){
 const types=['en2bn','bn2en','def','blank','ctx'],used=new Set(),qs=[],base=sh(pool);
 for(let k=0;k<n;k++){const w=base[k%base.length];let ty,tr=0;
  do{ty=types[Math.random()*5|0];tr++}while(used.has(w.w+ty)&&tr<25);
  const rx=new RegExp('\\b'+w.w.slice(0,Math.max(4,w.w.length-3))+'\\w*','i');
  if((ty==='blank'||ty==='ctx')&&!rx.test(w.e))ty='def';used.add(w.w+ty);
  const ot=sh(dp.filter(x=>x.w!==w.w)).slice(0,3);let q,o,a;
  if(ty==='en2bn'){q=`What does <b>${w.w}</b> mean in Bengali?`;o=[w.b,...ot.map(x=>x.b)];a=w.b}
  else if(ty==='bn2en'){q=`Which English word means “${w.b}”?`;o=[w.w,...ot.map(x=>x.w)];a=w.w}
  else if(ty==='def'){q=`Which word means “${w.d}”?`;o=[w.w,...ot.map(x=>x.w)];a=w.w}
  else{const bl=w.e.replace(rx,'_____');q=ty==='ctx'?`${bl}<div class="hint">${w.t}</div>`:`Complete the sentence:<br>${bl}`;o=[w.w,...ot.map(x=>x.w)];a=w.w}
  qs.push({q,o:sh(o),a,w})}
 return qs}
function startBatch(){const b=B[st.b];let dp=b.w;if(b.w.length<4){const seen=new Set(b.w.map(x=>x.w));dp=b.w.concat(learned().filter(x=>!seen.has(x.w)))}startTest('Batch '+(st.b+1)+' test','batch',b.w,dp)}
function startAll(mode){const L=learned();startTest(mode==='weak'?'Weak words practice':'All vocabulary test',mode,mode==='weak'?weak():L,L)}
function startTest(label,kind,pool,dp){
 if(!pool.length)return;
 T={label,kind,pool,dp,qs:makeQs(pool,cfg.n,dp),i:0,ans:undefined,log:[],end:cfg.min?Date.now()+cfg.min*60000:0};
 if(tick)clearInterval(tick);
 if(T.end)tick=setInterval(()=>{if(!T)return;const s=Math.max(0,Math.round((T.end-Date.now())/1000)),e=document.getElementById('tm');
  if(e)e.textContent=String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(s<=0)finish()},500);
 render()}
function renderTest(){
 const q=T.qs[T.i],done=T.ans!==undefined;
 app.innerHTML=`<div class="mut" style="display:flex;justify-content:space-between"><span>${T.label}</span><span id="tm">${T.end?'':''}</span></div><div class="bar"><i style="width:${(T.i+(done?1:0))/T.qs.length*100}%"></i></div>
 <div class="card q">${q.q}</div>
 ${q.o.map((o,i)=>`<button class="opt ${done?(o===q.a?'ok':(o===T.ans?'bad':'')):''}" onclick="pick(${i})">${o}</button>`).join('')}
 ${done?`<div class="card left" style="margin-top:12px"><b>${q.w.w}</b> <span class="mut">${q.w.i}</span><br>${q.w.b}<div class="mut">${q.w.e}<br>${q.w.t}</div></div><div class="nav"><button class="btn" onclick="nextQ()">${T.i===T.qs.length-1?'See results':'Next question'}</button></div>`:''}`}
function pick(i){if(T.ans!==undefined)return;const q=T.qs[T.i];T.ans=q.o[i];const ok=T.ans===q.a;
 const m=st.m[q.w.w]||(st.m[q.w.w]={c:0,w:0,s:0});if(ok){m.c++;m.s++}else{m.w++;m.s=0}
 T.log.push({q,ok,given:T.ans});save();renderTest()}
function nextQ(){T.i++;T.ans=undefined;if(T.i>=T.qs.length)finish();else renderTest()}
function finish(){
 if(!T)return;if(tick)clearInterval(tick);
 const score=T.log.filter(x=>x.ok).length,total=T.qs.length;
 for(let k=T.log.length;k<total;k++)T.log.push({q:T.qs[k],ok:false,given:null});
 st.res.push({k:T.label,s:score,t:total,d:Date.now()});st.res=st.res.slice(-30);
 const wasBatch=T.kind==='batch';if(wasBatch&&!st.fin.includes(st.b))st.fin.push(st.b);R={label:T.label,kind:T.kind,score,total,log:T.log,wasBatch};T=null;save();render()}
function renderResult(){
 const p=Math.round(R.score/R.total*100),wrong=R.log.filter(x=>!x.ok),right=R.log.filter(x=>x.ok);
 app.innerHTML=`<div class="card"><div class="mut">${R.label}</div><div class="score">${R.score}/${R.total}</div><div>${p}% · ${right.length} correct · ${wrong.length} incorrect</div></div>
 ${wrong.length?`<div class="card left"><h3 style="margin-top:0">To review</h3>${wrong.map(x=>`<div class="rev"><div>${x.q.q}</div><div style="color:var(--bad)">${x.given===null?'Not answered':'Your answer: '+x.given}</div><div style="color:var(--ok)">Correct: ${x.q.a}</div><div class="mut">${x.q.w.w} ${x.q.w.i} — ${x.q.w.b}<br>${x.q.w.e}</div></div>`).join('')}</div>`:'<div class="card">Perfect score! 🎉</div>'}
 <div class="nav"><button class="btn sec" onclick="retake()">Retake</button>${R.wasBatch?`<button class="btn" onclick="goHome()">Back to batches</button>`:`<button class="btn" onclick="tab('learn')">Back to Learn</button>`}</div>`;window.scrollTo(0,0)}
function retake(){const k=R.kind;R=null;if(k==='batch')startBatch();else startAll(k==='weak'?'weak':'all')}
function goHome(){if(tick)clearInterval(tick);T=null;R=null;save();st.stage='home';st.tab='learn';save();render()}
function showMean(t){const x=B[st.b].w.find(v=>v.w.toLowerCase()===t.toLowerCase());if(!x)return;const p=document.getElementById('pop');
 p.innerHTML=`<button class="x" onclick="closePop()" aria-label="Close">✕</button><div class="ipa" style="justify-content:flex-start"><b style="font-size:24px">${x.w}</b> ${x.i}<button class="spk" onclick="say('${x.w}')" aria-label="Play pronunciation">🔊</button></div><div class="big" style="margin:6px 0 2px">${x.b}</div><div class="mut">${x.d}</div>`;p.style.display='block'}
function closePop(){const p=document.getElementById('pop');if(p)p.style.display='none'}
render();
// PWA offline support
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.warn));
}
</script></body></html>
